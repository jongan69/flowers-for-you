                const b = clamp(.55 - .35 * dx - .35 * dy + dim);
                plot(col, row, zt + .06, s < .17 ? '@' : 'o', center[Math.floor(b * center.length)]);
                continue;
              }
              const ph = Math.atan2(dy, dx), reach = .32 + .68 * Math.abs(Math.cos(petals * (ph + rot) / 2)) ** .7;
              if (s > reach) continue;
              const edge = s > reach - .14 ? -.22 : 0;
              const b = clamp(.62 - .22 * dx - .28 * dy + .12 * s + edge + dim);
              plot(col, row, zt + .04 * (1 - s), PETAL[Math.floor(b * PETAL.length)], pal[Math.floor(b * pal.length)]);
            } else {
              const v = (1 - dy) / 2;
              if (v < 0 || v > 1) continue;
              const hw = .62 * Math.sin(Math.PI * .5 * Math.min(1, v * 1.5 + .05));
              if (hw <= 0 || Math.abs(dx) > hw) continue;
              const xn = dx / hw;
              if (v > .72 + .28 * Math.cos(1.5 * Math.PI * xn) ** 2) continue;
              const seam = Math.abs(Math.abs(xn) - .33) < .12 && v > .3 ? -.25 : 0;
              const b = clamp(.55 - .3 * xn + .1 * v + seam + dim);
              plot(col, row, zt + .03, PETAL[Math.floor(b * PETAL.length)], pal[Math.floor(b * pal.length)]);
            }
          }
        }
      }
      for (const [x, y, z, phase] of babies) {
        const [col, row, zt] = project(x, y, z), star = Math.sin(elapsed * 2 + phase) > .6;
        plot(col, row, zt + .02, star ? '*' : '·', star ? 231 : 255);
      }
      for (const [x, y, z, phase, rate] of sparkles) {
        const [col, row, zt] = project(x, y, z), tw = Math.sin(elapsed * rate + phase);
        if (tw > 0) plot(col, row, zt, tw > .85 ? '*' : tw > .4 ? '+' : '·', tw > .85 ? 231 : tw > .4 ? 225 : 218);
      }
      ctx.fillStyle = '#09090d'; ctx.fillRect(0, 0, width, height);
      const ox = (width - cols * cellW) / 2, oy = (height - rows * cellH) / 2;
      let lastColor = -1;
      for (let i = 0; i < chars.length; i++) {
        if (chars[i] === ' ') continue;
        if (inks[i] !== lastColor) { lastColor = inks[i]; ctx.fillStyle = colors[lastColor]; }
        ctx.fillText(chars[i], ox + (i % cols + .5) * cellW, oy + (Math.floor(i / cols) + .5) * cellH);
      }
    }

    function tick(now) {
      frame = 0;
      if (!playing || document.hidden || skipped) { previous = null; return; }
      if (previous === null) previous = now;
      const delta = now - previous;
      if (delta >= 1000 / 24) {
        const dt = Math.min(delta / 1000, .12);
        previous = now;
        elapsed += dt; angle = (angle + dt * .6 * speed) % (Math.PI * 2);
        for (const h of hearts) {
          h[1] -= h[2] * dt;
          if (h[1] < 0) { h[0] = Math.random(); h[1] = 1; h[4] = HEART_COLORS[Math.floor(Math.random() * 6)]; }
        }
        render();
      }
      frame = requestAnimationFrame(tick);
    }
    function syncPlayback() {
      cancelAnimationFrame(frame); frame = 0; previous = null;
      pauseButton.textContent = playing ? 'Pause' : 'Play';
      if (playing && !document.hidden && !skipped) frame = requestAnimationFrame(tick);
    }
    pauseButton.addEventListener('click', () => { playing = !playing; syncPlayback(); });
    speedInput.addEventListener('input', () => {
      speed = Number(speedInput.value); settings.speed = speed; saveSettings();
    });
    messageInput.addEventListener('input', () => {
      settings.message = messageInput.value; saveSettings();
    });
    noteInput.addEventListener('input', () => {
      settings.note = noteInput.value; saveSettings();
    });
    document.getElementById('save').addEventListener('click', () => {
      // Keep license and scene in the download. Only hide the editor, never
      // interpolate user text as HTML, and don't depend on browser storage.
      const copy = document.documentElement.cloneNode(true);
      copy.querySelector('#bouquet-config').textContent = JSON.stringify({...settings, gift: true}).replace(/</g, '\\u003c');
      copy.querySelector('body').classList.add('gift');
      copy.querySelector('#customize').removeAttribute('open');
      const sourceLicense = Array.from(document.childNodes).find(node => node.nodeType === Node.COMMENT_NODE);
      const html = '<!doctype html>\n' + (sourceLicense ? '<!--' + sourceLicense.data + '-->\n' : '') + copy.outerHTML;
      const url = URL.createObjectURL(new Blob([html], {type:'text/html;charset=utf-8'}));
      const link = document.createElement('a');
      link.href = url; link.download = 'flowers-for-you.html';
      document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      document.getElementById('save-status').textContent = 'Your bouquet is saved as flowers-for-you.html. Open it in a browser to see the finished version.';
    });
    document.getElementById('copy-link').addEventListener('click', async () => {
      const status = document.getElementById('save-status');
      if (!/^https?:$/.test(location.protocol)) {
        status.textContent = 'Open the published website to copy a link, or use Save bouquet for an offline copy.';
        return;
      }
      const url = new URL(location.href); url.search = '';
      url.hash = new URLSearchParams({message:settings.message, note:settings.note, speed:String(settings.speed)}).toString();
      const field = document.getElementById('gift-link'); field.value = url.href; field.hidden = false;
      try {
        await navigator.clipboard.writeText(url.href);
        status.textContent = 'Gift link copied. This link includes your message and hides the editing controls.';
      } catch {
        field.focus(); field.select();
        status.textContent = 'Copy the selected link to share your bouquet.';
      }
    });
    reducedMotion.addEventListener('change', event => { if (event.matches) { playing = false; syncPlayback(); } });
    document.addEventListener('visibilitychange', syncPlayback);
    // Listen on the actual rendering container: this event need not bubble.
    if ('oncontentvisibilityautostatechange' in stage) {
      stage.addEventListener('contentvisibilityautostatechange', event => { skipped = event.skipped; syncPlayback(); });
    } else if ('IntersectionObserver' in window) {
      new IntersectionObserver(entries => { skipped = !entries[0].isIntersecting; syncPlayback(); }, {rootMargin: '200px'}).observe(stage);
    }
    new ResizeObserver(resize).observe(stage);
    resize(); syncPlayback();
  })();
  </script>
</body>
</html>
